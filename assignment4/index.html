<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/login.js"></script>
</head>
<body>
    <h1>Hospital Triage System</h1>
    <div id="patient-login">
        <h2>Patient Login</h2>
        <form id="patientLoginForm" action="php/login.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="unique_code">3-Letter Code:</label>
            <input type="text" id="unique_code" name="unique_code" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="admin-login">
        <h2>Admin Login</h2>
        <form id="adminLoginForm" action="php/login.php" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
